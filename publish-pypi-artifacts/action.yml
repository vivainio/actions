name: Publish PyPI artifacts
description: Download built distributions and publish using the caller workflow's trusted publisher

inputs:
  artifact-pattern:
    description: Artifact names to download from the current workflow run
    default: wheels-*
  run-id:
    description: Optional workflow run to download artifacts from when retrying publishing
    default: ''
  packages-dir:
    description: Directory for downloaded distributions
    default: dist
  repository-url:
    description: Package index upload URL; defaults to PyPI
    default: https://upload.pypi.org/legacy/

runs:
  using: composite
  steps:
    - name: Download distributions
      uses: actions/download-artifact@v4
      with:
        run-id: ${{ inputs.run-id }}
        github-token: ${{ github.token }}
        pattern: ${{ inputs.artifact-pattern }}
        merge-multiple: true
        path: ${{ inputs.packages-dir }}
    - name: Check distributions exist
      shell: bash
      env:
        PACKAGES_DIR: ${{ inputs.packages-dir }}
      run: |
        python3 - <<'PYTHON'
        import os
        from pathlib import Path
        directory = Path(os.environ['PACKAGES_DIR'])
        if not any(directory.glob('*.whl')) and not any(directory.glob('*.tar.gz')):
            raise SystemExit(f'No wheel or source distributions found in {directory}')
        PYTHON
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Publish distributions
      shell: bash
      env:
        PACKAGES_DIR: ${{ inputs.packages-dir }}
        PUBLISH_URL: ${{ inputs.repository-url }}
      run: |
        shopt -s nullglob
        distributions=("$PACKAGES_DIR"/*.whl "$PACKAGES_DIR"/*.tar.gz)
        uv publish --trusted-publishing always --publish-url "$PUBLISH_URL" "${distributions[@]}"
